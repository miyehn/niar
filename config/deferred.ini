gi:
{
    enabled: 1

    # max samples stored in history (shaded texel is actually maxSampleCount + 1)
    maxSampleCount: 64

    # distance (in world units) between last frame's reprojected surface point and this pixel's tangent plane,
    # above which history is rejected (disocclusion detection)
    historyDepthRejectionThreshold: 0.2

    # replaces the final image with a GI history debug view (black = sky):
    # 0 = off
    # 1 = sample count: red = history just reset (count 1), green = history saturated at maxSampleCount
    # 2 = why history was rejected this frame: gray = accepted, blue = reprojected out of bounds,
    #     yellow = empty history (sky or cleared), red = depth mismatch
    debugHistory: 0
}

taa:
{
    enabled: 1

    # blend weight given to reprojected history; higher = more temporal smoothing, more potential ghosting
    historyWeight: 0.95

    # widens the 3x3 neighborhood color clamp box by this fraction; higher = looser clamp,
    # less ghost rejection but less over-tightening on thin/high-frequency detail
    clampExpansion: 0.25
}
